<body>
<div id="toast-host"></div>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================= ONLINE CLOUD STORAGE ============================= */
/*
  Online mode uses Supabase Auth + Postgres + Realtime.
  Put your Supabase project URL and anon/public key in config.js (see README).
  The browser never receives a service-role key.
*/
const STORE_KEY = 'isp_billing_store_v2';
const SESSION_KEY = 'isp_billing_session_v2';
const CLOUD_CONFIG = window.ISP_CLOUD_CONFIG || { url:'', anonKey:'' };
let STORAGE_OK = true;
let CLOUD_ENABLED = false;
let SB = null;
let CLOUD_COMPANY_ID = null;
let CLOUD_SUB = null;
let CLOUD_SYNC_CHAIN = Promise.resolve();
let CLOUD_LAST_REMOTE = 0;

function emptyStore(){
  return { company:null, packages:[], customers:[], collectors:[], payments:[], counters:{customerSeq:0, receiptSeq:0} };
}
function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return emptyStore();
    const x = JSON.parse(raw);
    return {
      ...emptyStore(),
      ...x,
      company: x.company || null,
      packages: Array.isArray(x.packages) ? x.packages : [],
      customers: Array.isArray(x.customers) ? x.customers : [],
      collectors: Array.isArray(x.collectors) ? x.collectors : [],
      payments: Array.isArray(x.payments) ? x.payments : [],
      counters: {...emptyStore().counters, ...(x.counters||{})}
    };
  }catch(e){ STORAGE_OK = false; }
  return emptyStore();
}
let CACHE = loadStore();

function localPersist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(CACHE)); }
  catch(e){ STORAGE_OK=false; }
}
function sanitizeCloudStore(){
  const copy = JSON.parse(JSON.stringify(CACHE));
  if(copy.company) delete copy.company.adminPasswordHash;
  (copy.collectors||[]).forEach(c=>delete c.passwordHash);
  return copy;
}
async function initCloud(){
  if(!CLOUD_CONFIG.url || !CLOUD_CONFIG.anonKey || !window.supabase) return false;
  try{
    SB = window.supabase.createClient(CLOUD_CONFIG.url, CLOUD_CONFIG.anonKey, {
      auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
    });
    CLOUD_ENABLED = true;
    return true;
  }catch(e){
    CLOUD_ENABLED = false;
    return false;
  }
}
async function cloudProfile(){
  if(!SB) return null;
  const {data:{user}} = await SB.auth.getUser();
  if(!user) return null;
  const {data:profile,error} = await SB.from('profiles').select('*').eq('id',user.id).single();
  if(error) throw error;
  return {user,profile};
}
async function cloudPull(){
  const cp = await cloudProfile();
  if(!cp) return false;
  const {user,profile}=cp;
  CLOUD_COMPANY_ID = profile.company_id;
  const {data:company,error:ce} = await SB.from('companies').select('*').eq('id',profile.company_id).single();
  if(ce) throw ce;
  const {data:row,error:de} = await SB.from('company_data').select('data,updated_at').eq('company_id',profile.company_id).single();
  if(de) throw de;
  CACHE = row?.data || emptyStore();
  CACHE.company = CACHE.company || {};
  CACHE.company.cloudCompanyId = company.id;
  CACHE.company.companyName = company.name;
  CACHE.company.adminName = company.admin_name || CACHE.company.adminName || '';
  CACHE.company.adminEmail = company.admin_email || CACHE.company.adminEmail || user.email || '';
  normalizeCustomerBillingStarts();
  localPersist();
  CLOUD_LAST_REMOTE = row?.updated_at ? Date.parse(row.updated_at) : Date.now();
  startRealtime();
  return true;
}
async function cloudPush(){
  if(!CLOUD_ENABLED || !SB || !CLOUD_COMPANY_ID) return;
  const data = sanitizeCloudStore();
  const {error} = await SB.from('company_data').upsert(
    {company_id:CLOUD_COMPANY_ID,data,updated_at:new Date().toISOString()},
    {onConflict:'company_id'}
  );
  if(error) throw error;
  CLOUD_LAST_REMOTE = Date.now();
}
function persist(){
  localPersist();
  if(!CLOUD_ENABLED || !CLOUD_COMPANY_ID) return;
  CLOUD_SYNC_CHAIN = CLOUD_SYNC_CHAIN.then(()=>cloudPush()).catch(err=>{
    console.error('Cloud sync error',err);
    toast('Cloud sync failed — check internet connection','err');
  });
}
function startRealtime(){
  if(!SB || !CLOUD_COMPANY_ID) return;
  if(CLOUD_SUB) SB.removeChannel(CLOUD_SUB);
  CLOUD_SUB = SB.channel('isp-company-'+CLOUD_COMPANY_ID)
    .on('postgres_changes',
      {event:'*',schema:'public',table:'company_data',filter:'company_id=eq.'+CLOUD_COMPANY_ID},
      async payload=>{
        if(!payload.new?.data) return;
        const ts = payload.new.updated_at ? Date.parse(payload.new.updated_at) : Date.now();
        if(ts < CLOUD_LAST_REMOTE) return;
        CLOUD_LAST_REMOTE = ts;
        CACHE = payload.new.data;
        localPersist();
        if(SESSION) render();
        toast('Data synced','ok');
      })
    .subscribe();
}
async function cloudRegister(formData){
  if(!CLOUD_ENABLED) throw new Error('Online mode is not configured. Add Supabase URL and anon key in config.js.');
  const email = String(formData.get('adminEmail')).trim().toLowerCase();
  const password = String(formData.get('password'));
  const {data,error} = await SB.auth.signUp({email,password});
  if(error) throw error;
  if(!data.session || !data.user) throw new Error('Account created, but email confirmation is enabled. Disable “Confirm email” in Supabase Auth settings, then register again.');
  const companyId = uid();
  const company = {
    id:companyId,
    name:String(formData.get('companyName')).trim(),
    address:String(formData.get('address')||'').trim(),
    phone:String(formData.get('phone')||'').trim(),
    admin_name:String(formData.get('adminName')).trim(),
    admin_email:email,
    owner_id:data.user.id
  };
  let r = await SB.from('companies').insert(company).select().single();
  if(r.error) throw r.error;
  r = await SB.from('profiles').insert({id:data.user.id,company_id:companyId,role:'admin',display_name:company.admin_name,username:null}).select().single();
  if(r.error) throw r.error;
  const base = emptyStore();
  base.company = {
    cloudCompanyId:companyId, companyName:company.name, address:company.address, phone:company.phone,
    adminName:company.admin_name, adminEmail:email, createdAt:new Date().toISOString()
  };
  const {error:de} = await SB.from('company_data').insert({company_id:companyId,data:base});
  if(de) throw de;
  CACHE=base; CLOUD_COMPANY_ID=companyId; localPersist(); startRealtime();
  return {user:data.user,company};
}
function collectorAuthEmail(username){
  return String(username).trim().toLowerCase()+'@collector.isp.local';
}
async function cloudLoginAdmin(email,password){
  const {error} = await SB.auth.signInWithPassword({email,password});
  if(error) throw error;
  await cloudPull();
  return 'admin';
}
async function cloudLoginCollector(username,password){
  const {error} = await SB.auth.signInWithPassword({email:collectorAuthEmail(username),password});
  if(error) throw error;
  const cp = await cloudProfile();
  if(!cp || cp.profile.role!=='collector') throw new Error('This account is not a collector account.');
  const c = (CACHE.collectors||[]).find(x=>x.username===username);
  if(c && c.status!=='Active') throw new Error('This account is disabled');
  await cloudPull();
  return 'collector';
}
async function cloudCreateCollector({name,username,mobile,password,status}){
  const secondary = window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey,{
    auth:{persistSession:false,autoRefreshToken:false}
  });
  const email=collectorAuthEmail(username);
  const {data,error}=await secondary.auth.signUp({email,password});
  if(error) throw error;
  if(!data.user) throw new Error('Could not create collector login');
  const id=uid();
  const {error:pe}=await SB.from('profiles').insert({
    id:data.user.id,company_id:CLOUD_COMPANY_ID,role:'collector',display_name:name,username
  });
  if(pe) throw pe;
  CACHE.collectors.push({id,name,username,mobile,status});
  persist();
}
async function cloudUpdateCollectorPassword(username,newPassword){
  throw new Error('For security, reset collector passwords from Supabase Auth or create a new collector account.');
}
async function cloudLogout(){
  if(CLOUD_SUB && SB){ await SB.removeChannel(CLOUD_SUB); CLOUD_SUB=null; }
  CLOUD_COMPANY_ID=null;
  if(SB) await SB.auth.signOut();
}
async function cloudInitSession(){
  if(!CLOUD_ENABLED) return false;
  const {data:{session}} = await SB.auth.getSession();
  if(!session) return false;
  try{ return await cloudPull(); }catch(e){
    console.error(e);
    await SB.auth.signOut();
    return false;
  }
}

/* ============================= STATE ============================= */
let SESSION = null;
let VIEW = 'boot';
let MODAL = null;
let SELECTED_MONTH = new Date().getMonth()+1;
let SELECTED_YEAR = new Date().getFullYear();
let SEARCH_Q = '';
let PAY_FILTERS = { month:'', year:'', collector:'', method:'' };
let COLLECT_CUSTOMER = null;
let LAST_RECEIPT = null;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ============================= UTILS ============================= */
function pad(n,l){ n=String(n); while(n.length<l) n='0'+n; return n; }
function fmtInt(n){
  n = Math.round(Number(n)||0);
  const neg = n<0; n = Math.abs(n);
  let s = String(n);
  let last3 = s.slice(-3);
  let rest = s.slice(0,-3);
  if(rest !== ''){ rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ','); last3 = ',' + last3; }
  return (neg?'-':'') + rest + last3;
}
function fmtBDT(n){ return '৳' + fmtInt(n); }
function fmtDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  return pad(dt.getDate(),2)+'-'+pad(dt.getMonth()+1,2)+'-'+dt.getFullYear();
}
function dhakaParts(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  const parts = new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Dhaka', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(dt);
  const o={}; parts.forEach(p=>o[p.type]=p.value); return o;
}
function fmtDateTime(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  let h = dt.getHours(); const ampm = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12;
  return fmtDate(dt) + ' ' + pad(h,2)+':'+pad(dt.getMinutes(),2)+' '+ampm;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function hashPass(id, pass){
  const enc = new TextEncoder().encode('isp-app::' + String(id).toLowerCase().trim() + '::' + pass);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return toHex(buf);
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ============================= DERIVED / LEDGER LOGIC ============================= */
function customerStartParts(customer){
  const raw = String(customer.billingStart || '').trim();
  if(/^\\d{4}-\\d{2}$/.test(raw)){
    const y = Number(raw.slice(0,4)), m = Number(raw.slice(5,7));
    if(m>=1 && m<=12) return {y,m};
  }
  const created = new Date(customer.createdAt);
  if(!isNaN(created.getTime())) return {y:created.getFullYear(), m:created.getMonth()+1};
  return null;
}
function billingStartValue(customer){
  const p = customerStartParts(customer);
  return p ? `${p.y}-${pad(p.m,2)}` : '';
}
function normalizeCustomerBillingStarts(){
  let changed = false;
  (CACHE.customers||[]).forEach(c=>{
    if(!c.billingStart){
      const p = customerStartParts(c);
      if(p){ c.billingStart = `${p.y}-${pad(p.m,2)}`; changed = true; }
    }
  });
  if(changed) localPersist();
}
function monthsElapsed(customer, asOfYear, asOfMonth){
  const start = customerStartParts(customer);
  if(!start) return 0;
  const diff = (asOfYear - start.y)*12 + (asOfMonth - start.m) + 1;
  return Math.max(diff, 0);
}
function totalPaidByCustomer(customerId, upToYear, upToMonth){
  let sum = 0;
  for(const p of CACHE.payments){
    if(p.customerId !== customerId) continue;
    if(upToYear==null){ sum += Number(p.amount)||0; continue; }
    if(p.year < upToYear || (p.year===upToYear && p.month<=upToMonth)) sum += Number(p.amount)||0;
  }
  return sum;
}
function ledgerDue(customer, asOfYear, asOfMonth){
  const months = monthsElapsed(customer, asOfYear, asOfMonth);
  const billed = months * (Number(customer.monthlyBill)||0);
  const paid = totalPaidByCustomer(customer.id, asOfYear, asOfMonth);
  return billed - paid;
}
function paymentsInMonth(year, month){ return CACHE.payments.filter(p=>p.year===year && p.month===month); }
function collectorPaymentsInMonth(collectorId, year, month){ return CACHE.payments.filter(p=>p.collectorId===collectorId && p.year===year && p.month===month); }
function isToday(dateIso){
  const d = new Date(dateIso); const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function activeCustomersAsOf(year, month){
  const endOfMonth = new Date(year, month, 0, 23,59,59);
  return CACHE.customers.filter(c=>{
    if(c.status !== 'Active') return false;
    const created = new Date(c.createdAt);
    return created <= endOfMonth;
  });
}
function packageName(id){ const p = CACHE.packages.find(x=>x.id===id); return p ? p.name : '—'; }

function viewAdminDashboard(){
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth()+1;
  const active = activeCustomersAsOf(y,m);
  const monthPays = paymentsInMonth(y,m);
  const thisMonthTotal = monthPays.reduce((s,p)=>s+Number(p.amount||0),0);
  const todayTotal = CACHE.payments.filter(p=>isToday(p.date)).reduce((s,p)=>s+Number(p.amount||0),0);
  const totalDue = active.reduce((s,c)=>s+Math.max(ledgerDue(c,y,m),0),0);
  const paidCustomerIds = new Set(monthPays.map(p=>p.customerId));
  const paidCount = active.filter(c=>paidCustomerIds.has(c.id)).length;
  const dueCount = active.filter(c=>Math.max(ledgerDue(c,y,m),0)>0).length;
  const months = [];
  for(let i=8;i>=0;i--){ const d = new Date(y, m-1-i, 1); months.push({y:d.getFullYear(), m:d.getMonth()+1, label:MONTHS[d.getMonth()].slice(0,3)}); }
  const maxVal = Math.max(1, ...months.map(mo=>paymentsInMonth(mo.y,mo.m).reduce((s,p)=>s+Number(p.amount||0),0)));
  const bars = months.map(mo=>{
    const total = paymentsInMonth(mo.y,mo.m).reduce((s,p)=>s+Number(p.amount||0),0);
    const h = Math.max(2, Math.round((total/maxVal)*100));
    const isNow = mo.y===y && mo.m===m;
    return `<div class="bar-wrap"><div class="bar ${isNow?'now':''}" style="height:${h}%" title="${MONTHS[mo.m-1]} ${mo.y}: ${fmtBDT(total)}"></div><div class="mlabel">${mo.label}</div></div>`;
  }).join('');
  return `
  <div class="pagehead"><div><h1>Dashboard</h1><div class="sub">${MONTHS[m-1]} ${y} · Asia/Dhaka</div></div></div>
  <div class="grid grid-stats" style="margin-bottom:22px;">
    <div class="stat"><div class="label">Total customers</div><div class="value">${fmtInt(CACHE.customers.length)}</div></div>
    <div class="stat brand"><div class="label">This month collection</div><div class="value">${fmtBDT(thisMonthTotal)}</div></div>
    <div class="stat gold"><div class="label">Today's collection</div><div class="value">${fmtBDT(todayTotal)}</div></div>
    <div class="stat red"><div class="label">Total due</div><div class="value">${fmtBDT(totalDue)}</div></div>
    <div class="stat brand"><div class="label">Paid customers</div><div class="value">${fmtInt(paidCount)}</div></div>
    <div class="stat red"><div class="label">Due customers</div><div class="value">${fmtInt(dueCount)}</div></div>
  </div>
  <div class="card" style="margin-bottom:22px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
      <div style="font-weight:600;font-size:14px;">Monthly collection</div><div style="font-size:12px;color:var(--ink-soft);">Last 9 months</div>
    </div>
    <div class="barchart">${bars}</div>
  </div>
  <div class="section-title">Collector-wise collection — ${MONTHS[m-1]}</div>
  ${renderCollectorWiseTable(y,m)}
  `;
}
function renderCollectorWiseTable(y,m){

/* ============================= ADMIN: REPORTS ============================= */
function viewReports(){
  const y = SELECTED_YEAR, m = SELECTED_MONTH;
  const active = activeCustomersAsOf(y,m);
  const totalBill = active.reduce((s,c)=>s+Number(c.monthlyBill||0),0);
  const monthPays = paymentsInMonth(y,m);
  const collected = monthPays.reduce((s,p)=>s+Number(p.amount||0),0);
  const due = active.reduce((s,c)=>s + Math.max(ledgerDue(c,y,m),0), 0);
  const paidIds = new Set(monthPays.map(p=>p.customerId));
  const paidCount = active.filter(c=>paidIds.has(c.id)).length;
  const dueCount = active.length - paidCount;
  const byMethod = {Cash:0, bKash:0, Nagad:0, Bank:0};
  monthPays.forEach(p=>{ if(byMethod[p.method]!=null) byMethod[p.method]+=Number(p.amount||0); });
  const years = Array.from(new Set([SELECTED_YEAR, ...CACHE.payments.map(p=>p.year), new Date().getFullYear()])).sort((a,b)=>b-a);
  return `
  <div class="pagehead"><div><h1>Reports</h1><div class="sub">Select a month to see the summary</div></div></div>
  <div class="toolbar">
    <select class="input" style="max-width:160px;" id="repMonth">${MONTHS.map((mn,i)=>`<option value="${i+1}" ${SELECTED_MONTH===i+1?'selected':''}>${mn}</option>`).join('')}</select>
    <select class="input" style="max-width:120px;" id="repYear">${years.map(yy=>`<option value="${yy}" ${SELECTED_YEAR===yy?'selected':''}>${yy}</option>`).join('')}</select>
    <div style="flex:1;"></div>
    <button class="btn" data-action="print-report">Print report</button>
    <button class="btn" data-action="pdf-report">Download PDF</button>
    <button class="btn" data-action="csv-report">Export Excel (CSV)</button>
  </div>
  <div class="grid grid-stats" style="margin-bottom:22px;">
    <div class="stat"><div class="label">Total bills — ${MONTHS[m-1]} ${y}</div><div class="value">${fmtBDT(totalBill)}</div></div>
    <div class="stat brand"><div class="label">Total collection</div><div class="value">${fmtBDT(collected)}</div></div>
    <div class="stat red"><div class="label">Total due</div><div class="value">${fmtBDT(due)}</div></div>
    <div class="stat"><div class="label">Customers paid</div><div class="value">${fmtInt(paidCount)}</div></div>
    <div class="stat"><div class="label">Customers due</div><div class="value">${fmtInt(dueCount)}</div></div>
  </div>
  <div class="section-title">Collection by method</div>
  <div class="grid grid-stats">
    <div class="stat"><div class="label">Cash</div><div class="value">${fmtBDT(byMethod.Cash)}</div></div>
    <div class="stat"><div class="label">bKash</div><div class="value">${fmtBDT(byMethod.bKash)}</div></div>
    <div class="stat"><div class="label">Nagad</div><div class="value">${fmtBDT(byMethod.Nagad)}</div></div>
    <div class="stat"><div class="label">Bank</div><div class="value">${fmtBDT(byMethod.Bank)}</div></div>
  </div>
  <div id="print-area" style="display:none;">
    <h2>${esc((CACHE.company||{}).companyName||'')} — Report for ${MONTHS[m-1]} ${y}</h2>
    <p>Total bills: ${fmtBDT(totalBill)} · Collected: ${fmtBDT(collected)} · Due: ${fmtBDT(due)}</p>
    <p>Customers paid: ${fmtInt(paidCount)} · Customers due: ${fmtInt(dueCount)}</p>
    <p>Cash: ${fmtBDT(byMethod.Cash)} · bKash: ${fmtBDT(byMethod.bKash)} · Nagad: ${fmtBDT(byMethod.Nagad)} · Bank: ${fmtBDT(byMethod.Bank)}</p>
  </div>
  `;
}

    <div class="field"><input class="input" id="collectSearch" placeholder="Search by ID, name or mobile number" value="${esc(SEARCH_Q)}" autofocus></div>
    ${q ? (list.length ? `<div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th></th></tr></thead><tbody>
      ${list.map(c=>`<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.name)}</td><td class="mono">${esc(c.mobile||'—')}</td><td style="text-align:right;"><button class="btn sm primary" data-select-customer="${esc(c.id)}">Select</button></td></tr>`).join('')}

    `;
  }
  const c = COLLECT_CUSTOMER;
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth()+1;
  const totalPayable = Math.max(ledgerDue(c, y, m), 0);
  const currentBill = Number(c.monthlyBill || 0);

  return `
  <div class="pagehead"><div><h1>Collect bill</h1><div class="sub">${esc(c.id)}</div></div>
    <button class="btn" data-action="cancel-collect">← Back to search</button>
  </div>

      <div><div class="field"><label>Mobile</label><div class="mono">${esc(c.mobile||'—')}</div></div></div>
      <div><div class="field"><label>Package</label><div>${esc(packageName(c.packageId))}</div></div></div>
      <div><div class="field"><label>Billing start</label><div>${esc(billingStartValue(c) || '—')}</div></div></div>
      <div><div class="field"><label>Monthly bill</label><div class="num">${fmtBDT(c.monthlyBill)}</div></div></div>
      <div><div class="field"><label>Previous due</label><div class="num due-num">${fmtBDT(Math.max(previousDue,0))}</div></div></div>
      <div><div class="field"><label>Total payable</label><div class="num" style="font-weight:700;">${fmtBDT(totalPayable)}</div></div></div>
    </div>

  <div class="card" style="max-width:420px;">
    <form id="collectForm">
      <div class="field"><label>Payment amount (৳)</label><input class="input" type="number" min="1" step="1" name="amount" value="${totalPayable>0?totalPayable:''}" required></div>
      <div class="field"><label>Payment method</label>
        <div class="pillrow" id="methodPills">${['Cash','bKash','Nagad','Bank'].map((mm,i)=>`<button type="button" class="pill ${i===0?'active':''}" data-method="${mm}">${mm}</button>`).join('')}</div>
        <input type="hidden" name="method" value="Cash">
      </div>
      <button class="btn primary block" type="submit" style="padding:13px;font-size:14.5px;" ${totalPayable<=0?'disabled':''}>${totalPayable>0?'Collect payment':'No outstanding due'}</button>
    </form>
  </div>
  `;
}

  </div>`;
}
function modalReceipt(r){
  const co = CACHE.company || {};
  return `<div class="modal">
    <div class="modal-head"><h2>Payment collected</h2><button class="modal-close" data-close-modal>&times;</button></div>
    <div id="print-area">
    <div class="receipt">
      <div class="rhead"><div class="co">${esc(co.companyName||'')}</div><div class="small">${esc(co.address||'')}</div><div class="small">${esc(co.phone||'')}</div></div>
      <div class="rtitle">PAYMENT RECEIPT</div>
      <div class="rrow"><span class="k">Receipt No</span><span>${esc(r.receiptNo)}</span></div>
      <div class="rrow"><span class="k">Customer ID</span><span>${esc(r.customerId)}</span></div>
      <div class="rrow"><span class="k">Customer Name</span><span>${esc(r.customerName)}</span></div>
      <div class="rrow"><span class="k">Billing Month</span><span>${MONTHS[r.month-1]} ${r.year}</span></div>
      <div class="rrow"><span class="k">Monthly Bill</span><span>${fmtBDT(r.billAmount)}</span></div>
      <div class="rrow"><span class="k">Previous Due</span><span>${fmtBDT(Math.max(r.previousDue,0))}</span></div>
      <div class="rrow"><span class="k">Paid</span><span>${fmtBDT(r.amount)}</span></div>
      <div class="rrow total"><span class="k">Remaining Due</span><span>${r.remainingDue>0?fmtBDT(r.remainingDue):'৳0'}</span></div>
      <div class="rrow"><span class="k">Payment Method</span><span>${esc(r.method)}</span></div>
      <div class="rrow"><span class="k">Collected By</span><span>${esc(r.collectorName)}</span></div>
      <div class="rrow"><span class="k">Date</span><span>${fmtDate(r.date)}</span></div>
      <div class="rfoot">Thank you for your payment</div>
    </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn block" data-action="print-receipt">Print receipt</button>
      <button type="button" class="btn primary block" data-action="pdf-receipt">Download PDF</button>
    </div>
    <button type="button" class="btn ghost block" style="margin-top:8px;" data-close-modal>Done</button>
  </div>`;
}

/* ============================= EVENT HANDLERS: VIEWS ============================= */
function attachViewHandlers(){
  const csearch = document.getElementById('customerSearch');
  if(csearch) csearch.addEventListener('input', ()=>{ SEARCH_Q = csearch.value; render(); const el=document.getElementById('customerSearch'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} });
  document.querySelectorAll('[data-action="add-customer"]').forEach(b=>b.addEventListener('click', ()=>{ MODAL={type:'customer', data:null}; render(); }));
  document.querySelectorAll('[data-edit-customer]').forEach(b=>b.addEventListener('click', ()=>{ const c = CACHE.customers.find(x=>x.id===b.getAttribute('data-edit-customer')); MODAL={type:'customer', data:c}; render(); }));
  document.querySelectorAll('[data-toggle-customer]').forEach(b=>b.addEventListener('click', ()=>{
    const c = CACHE.customers.find(x=>x.id===b.getAttribute('data-toggle-customer')); if(!c) return;
    c.status = c.status==='Active'?'Inactive':'Active'; persist(); toast('Customer updated','ok'); render();
  }));

  document.querySelectorAll('[data-action="add-package"]').forEach(b=>b.addEventListener('click', ()=>{ MODAL={type:'package', data:null}; render(); }));
  document.querySelectorAll('[data-edit-package]').forEach(b=>b.addEventListener('click', ()=>{ const p = CACHE.packages.find(x=>x.id===b.getAttribute('data-edit-package')); MODAL={type:'package', data:p}; render(); }));
  document.querySelectorAll('[data-delete-package]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-delete-package');
    const usedBy = CACHE.customers.filter(c=>c.packageId===id).length;
    if(usedBy>0){ toast(`Can't delete — ${usedBy} customer(s) use this package`, 'err'); return; }
    if(!confirm('Delete this package?')) return;
    CACHE.packages = CACHE.packages.filter(p=>p.id!==id); persist(); toast('Package deleted','ok'); render();
  }));

  document.querySelectorAll('[data-action="add-collector"]').forEach(b=>b.addEventListener('click', ()=>{ MODAL={type:'collector', data:null}; render(); }));
  document.querySelectorAll('[data-edit-collector]').forEach(b=>b.addEventListener('click', ()=>{ const c = CACHE.collectors.find(x=>x.id===b.getAttribute('data-edit-collector')); MODAL={type:'collector', data:c}; render(); }));
  document.querySelectorAll('[data-toggle-collector]').forEach(b=>b.addEventListener('click', ()=>{
    const c = CACHE.collectors.find(x=>x.id===b.getAttribute('data-toggle-collector')); if(!c) return;
    c.status = c.status==='Active'?'Inactive':'Active'; persist(); toast('Collector updated','ok'); render();
  }));
  document.querySelectorAll('[data-reset-collector]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = CACHE.collectors.find(x=>x.id===b.getAttribute('data-reset-collector')); if(!c) return;
    const np = prompt('Enter a new password for '+c.name+':'); if(!np) return;
    if(np.length<4){ toast('Password must be at least 4 characters','err'); return; }
    if(CLOUD_ENABLED){ toast('For online mode, reset this collector from Supabase Auth, or create a new collector account.','err'); return; }
    c.passwordHash = await hashPass(c.username, np); persist(); toast('Password reset','ok'); render();
  }));

  ['fMonth','fYear','fCollector','fMethod'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', ()=>{
      PAY_FILTERS = { month: document.getElementById('fMonth').value, year: document.getElementById('fYear').value, collector: document.getElementById('fCollector').value, method: document.getElementById('fMethod').value };
      render();
    });
  });

  const rm = document.getElementById('repMonth'), ry = document.getElementById('repYear');
  if(rm) rm.addEventListener('change', ()=>{ SELECTED_MONTH = Number(rm.value); render(); });
  if(ry) ry.addEventListener('change', ()=>{ SELECTED_YEAR = Number(ry.value); render(); });
  document.querySelectorAll('[data-action="print-report"]').forEach(b=>b.addEventListener('click', ()=>{
    const el = document.getElementById('print-area'); if(el) el.style.display='block';
    window.print(); if(el) el.style.display='none';
  }));
  document.querySelectorAll('[data-action="pdf-report"]').forEach(b=>b.addEventListener('click', downloadReportPdf));
  document.querySelectorAll('[data-action="csv-report"]').forEach(b=>b.addEventListener('click', downloadReportCsv));

  const scf = document.getElementById('settingsCompanyForm');
  if(scf) scf.addEventListener('submit', (e)=>{
    e.preventDefault(); const fd = new FormData(scf);
    CACHE.company.companyName = fd.get('companyName'); CACHE.company.address = fd.get('address')||''; CACHE.company.phone = fd.get('phone')||'';
    persist(); toast('Company details saved','ok'); render();
  });
  const spf = document.getElementById('settingsPasswordForm');
  if(spf) spf.addEventListener('submit', async (e)=>{
    e.preventDefault(); const fd = new FormData(spf);
    if(fd.get('password') !== fd.get('confirm')){ toast('Passwords do not match','err'); return; }
    if(CLOUD_ENABLED){
      const {error}=await SB.auth.updateUser({password:String(fd.get('password'))});
      if(error){ toast(error.message,'err'); return; }
    }else{
      CACHE.company.adminPasswordHash = await hashPass(CACHE.company.adminEmail, fd.get('password'));
      persist();
    }
    toast('Password updated','ok'); spf.reset();
  });
  document.querySelectorAll('[data-action="backup-data"]').forEach(b=>b.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(CACHE,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'isp-billing-backup-'+fmtDate(new Date()).replaceAll('-','')+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup downloaded','ok');
  }));
  document.querySelectorAll('[data-action="restore-data"]').forEach(b=>b.addEventListener('click', ()=>{ document.getElementById('restoreFile').click(); }));
  const rf = document.getElementById('restoreFile');
  if(rf) rf.addEventListener('change', ()=>{
    const file = rf.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object'){ throw new Error('bad file'); }
        if(!confirm('This will replace all current data on this device with the backup file. Continue?')) return;
        CACHE = Object.assign({ company:null, packages:[], customers:[], collectors:[], payments:[], counters:{customerSeq:0, receiptSeq:0} }, parsed);
        persist(); toast('Backup restored','ok'); render();
      }catch(e){ toast('That file could not be read as a backup', 'err'); }
    };
    reader.readAsText(file);
  });

  const collectSearch = document.getElementById('collectSearch');
  if(collectSearch) collectSearch.addEventListener('input', ()=>{ SEARCH_Q = collectSearch.value; render(); const el=document.getElementById('collectSearch'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} });
  document.querySelectorAll('[data-select-customer]').forEach(b=>b.addEventListener('click', ()=>{ COLLECT_CUSTOMER = CACHE.customers.find(x=>x.id===b.getAttribute('data-select-customer')); SEARCH_Q=''; render(); }));
  document.querySelectorAll('[data-action="cancel-collect"]').forEach(b=>b.addEventListener('click', ()=>{ COLLECT_CUSTOMER=null; render(); }));
  document.querySelectorAll('[data-method]').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-method]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const hidden = document.querySelector('#collectForm input[name=method]'); if(hidden) hidden.value = b.getAttribute('data-method');
  }));
  const collectForm = document.getElementById('collectForm');
  if(collectForm) collectForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(collectForm);
    const amount = Number(fd.get('amount')); const method = fd.get('method');
    if(!amount || amount<=0){ toast('Enter a valid amount','err'); return; }
    const btn = collectForm.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving…';
    const c = COLLECT_CUSTOMER; const now = new Date(); const y = now.getFullYear(), m = now.getMonth()+1;
    if(!c){ toast('Select a customer first','err'); btn.disabled=false; btn.textContent='Collect payment'; return; }
    const outstanding = Math.max(ledgerDue(c,y,m),0);
    if(outstanding <= 0){
      toast('This customer has no outstanding bill. Duplicate collection is blocked.','err');
      btn.disabled=false; btn.textContent='Collect payment'; return;
    }
    if(amount > outstanding){
      toast(`Maximum collectible amount is ${fmtBDT(outstanding)}`,'err');
      btn.disabled=false; btn.textContent='Collect payment'; return;
    }
    const latestOutstanding = Math.max(ledgerDue(c,y,m),0);
    if(latestOutstanding <= 0 || amount > latestOutstanding){
      toast(latestOutstanding <= 0 ? 'This bill is already fully paid.' : `Maximum collectible amount is ${fmtBDT(latestOutstanding)}`,'err');
      btn.disabled=false; btn.textContent='Collect payment'; return;
    }
    const previousDue = Math.max(latestOutstanding - Number(c.monthlyBill||0),0);
    const receiptNo = await nextReceiptNo();
    const payment = { receiptNo, customerId:c.id, customerName:c.name, amount, method, month:m, year:y, date: now.toISOString(), collectorId: SESSION.id, collectorName: SESSION.name, billAmount: Number(c.monthlyBill||0), previousDue };
    CACHE.payments.push(payment); persist();
    LAST_RECEIPT = { ...payment, remainingDue: Math.max(latestOutstanding - amount,0) };
    COLLECT_CUSTOMER = null; SEARCH_Q='';
    MODAL = { type:'receipt', data: LAST_RECEIPT };
    toast('Payment collected','ok'); render();
  });
}

/* ============================= EVENT HANDLERS: MODAL ============================= */
if(!window.__ISP_MODAL_ESCAPE_BOUND){
  window.__ISP_MODAL_ESCAPE_BOUND = true;
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && MODAL){ closeModal(); render(); }
  });
}
function attachModalHandlers(){
  const backdrop = document.getElementById('modalBackdrop');
  if(backdrop) backdrop.addEventListener('click', (e)=>{
    if(e.target===backdrop){ e.preventDefault(); closeModal(); render(); }
  });
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click', (e)=>{
    e.preventDefault(); closeModal(); render();
  }));

  const cf = document.getElementById('customerForm');
  if(cf) cf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(cf);
    const pkg = CACHE.packages.find(p=>p.id===fd.get('packageId'));
    const billingStart = String(fd.get('billingStart')||'').trim();
    if(!/^\\d{4}-\\d{2}$/.test(billingStart)){ toast('Select a valid billing start month','err'); return; }
    if(MODAL.data){
      const c = CACHE.customers.find(x=>x.id===MODAL.data.id);
      Object.assign(c, { name: fd.get('name'), mobile: fd.get('mobile')||'', address: fd.get('address')||'', status: fd.get('status'), packageId: fd.get('packageId'), monthlyBill: pkg?Number(pkg.price):Number(c.monthlyBill||0), billingStart });
      persist(); toast('Customer updated','ok');
    } else {
      const id = await nextCustomerId();
      CACHE.customers.push({ id, name: fd.get('name'), mobile: fd.get('mobile')||'', address: fd.get('address')||'', status: fd.get('status'), packageId: fd.get('packageId'), monthlyBill: pkg?Number(pkg.price):0, billingStart, createdAt: new Date().toISOString() });
      persist(); toast('Customer added','ok');
    }
    MODAL=null; render();
  });

  const pf = document.getElementById('packageForm');
  if(pf) pf.addEventListener('submit', (e)=>{
    e.preventDefault(); const fd = new FormData(pf);
    if(MODAL.data){ const p = CACHE.packages.find(x=>x.id===MODAL.data.id); Object.assign(p, { name: fd.get('name'), speed: fd.get('speed')||'', price: Number(fd.get('price')) }); toast('Package updated','ok'); }
    else { CACHE.packages.push({ id: uid(), name: fd.get('name'), speed: fd.get('speed')||'', price: Number(fd.get('price')) }); toast('Package added','ok'); }
    persist(); MODAL=null; render();
  });

  const colf = document.getElementById('collectorForm');
  if(colf) colf.addEventListener('submit', async (e)=>{
    e.preventDefault(); const fd = new FormData(colf);
    const username = String(fd.get('username')).trim().toLowerCase();
    if(MODAL.data){
      const c = CACHE.collectors.find(x=>x.id===MODAL.data.id);
      Object.assign(c, { name: fd.get('name'), mobile: fd.get('mobile')||'', status: fd.get('status') });
      persist(); toast('Collector updated','ok');
    } else {
      if(CACHE.collectors.find(c=>c.username===username)){ toast('That username is already taken','err'); return; }
      const hash = await hashPass(username, fd.get('password'));
      CACHE.collectors.push({ id: uid(), name: fd.get('name'), username, mobile: fd.get('mobile')||'', status: fd.get('status'), passwordHash: hash });
      persist(); toast('Collector added','ok');
    }
    MODAL=null; render();
  });

  document.querySelectorAll('[data-action="print-receipt"]').forEach(b=>b.addEventListener('click', ()=>{ window.print(); }));
  document.querySelectorAll('[data-action="pdf-receipt"]').forEach(b=>b.addEventListener('click', ()=>downloadReceiptPdf(MODAL.data)));
}

/* ============================= PDF / CSV EXPORT ============================= */
let JSPDF_READY = null;
function loadJsPdf(){
  if(JSPDF_READY) return JSPDF_READY;
  JSPDF_READY = new Promise((resolve,reject)=>{
    if(window.jspdf){ resolve(window.jspdf); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>resolve(window.jspdf);
    s.onerror = ()=>reject(new Error('Could not load PDF library — an internet connection is needed for this one feature'));
    document.head.appendChild(s);
  });
  return JSPDF_READY;
}
async function downloadReceiptPdf(r){
  try{
    const { jsPDF } = await loadJsPdf();
    const doc = new jsPDF({unit:'pt', format:[280,480]});
    const co = CACHE.company || {};
    let y = 30;
    doc.setFont('courier','bold'); doc.setFontSize(12); doc.text(co.companyName||'', 140, y, {align:'center'}); y+=14;
    doc.setFont('courier','normal'); doc.setFontSize(8); doc.text(co.address||'', 140, y, {align:'center'}); y+=11; doc.text(co.phone||'', 140, y, {align:'center'}); y+=16;
    doc.setFont('courier','bold'); doc.setFontSize(10); doc.text('PAYMENT RECEIPT', 140, y, {align:'center'}); y+=18;
    doc.setFont('courier','normal'); doc.setFontSize(9);
    const line = (k,v)=>{ doc.text(k, 20, y); doc.text(String(v), 260, y, {align:'right'}); y+=15; };
    line('Receipt No', r.receiptNo); line('Customer ID', r.customerId); line('Customer Name', r.customerName);
    line('Billing Month', MONTHS[r.month-1]+' '+r.year); line('Monthly Bill', fmtBDT(r.billAmount)); line('Previous Due', fmtBDT(Math.max(r.previousDue,0))); line('Paid', fmtBDT(r.amount));
    doc.setFont('courier','bold'); line('Remaining Due', r.remainingDue>0?fmtBDT(r.remainingDue):'৳0'); doc.setFont('courier','normal');
    line('Payment Method', r.method); line('Collected By', r.collectorName); line('Date', fmtDate(r.date));
    doc.save(r.receiptNo+'.pdf');
  }catch(err){ toast(err.message || 'Could not generate PDF', 'err'); }
}
async function downloadReportPdf(){
  try{
    const { jsPDF } = await loadJsPdf();
    const co = CACHE.company || {}; const y = SELECTED_YEAR, m = SELECTED_MONTH;
    const active = activeCustomersAsOf(y,m);
    const totalBill = active.reduce((s,c)=>s+Number(c.monthlyBill||0),0);
    const monthPays = paymentsInMonth(y,m);
    const collected = monthPays.reduce((s,p)=>s+Number(p.amount||0),0);
    const due = active.reduce((s,c)=>s + Math.max(ledgerDue(c,y,m),0), 0);
    const doc = new jsPDF({unit:'pt', format:'a4'});
    let yy = 50;
    doc.setFontSize(16); doc.text(co.companyName||'ISP Billing', 40, yy); yy+=22;
    doc.setFontSize(12); doc.text('Report — '+MONTHS[m-1]+' '+y, 40, yy); yy+=26;
    doc.setFontSize(11);
    [['Total bills', fmtBDT(totalBill)],['Total collection', fmtBDT(collected)],['Total due', fmtBDT(due)],
     ['Customers paid', String(active.filter(c=>monthPays.some(p=>p.customerId===c.id)).length)],
     ['Customers due', String(active.length - active.filter(c=>monthPays.some(p=>p.customerId===c.id)).length)]]
     .forEach(([k,v])=>{ doc.text(k+': '+v, 40, yy); yy+=18; });
    doc.save('report-'+MONTHS[m-1]+'-'+y+'.pdf');
  }catch(err){ toast(err.message || 'Could not generate PDF', 'err'); }
}
function downloadReportCsv(){
  const y = SELECTED_YEAR, m = SELECTED_MONTH;
  const rows = [['Date','Customer','Amount','Method','Collected By','Receipt']];
  paymentsInMonth(y,m).forEach(p=>rows.push([fmtDate(p.date), p.customerName, p.amount, p.method, p.collectorName, p.receiptNo]));
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'payments-'+MONTHS[m-1]+'-'+y+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
